<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Live Match Schedule</title>
<style>
body { font-family: Arial; background:#111; color:#fff; }
.match { margin:10px 0; padding:10px; border-bottom:1px solid #333; }
.league { color:#0f0; font-weight:bold; }
</style>
</head>
<body>

<h2>🔥 LIVE MATCH</h2>
<div id="list"></div>

<script>
fetch("schedule.json")
.then(r => r.json())
.then(data => {
  document.getElementById("list").innerHTML =
    data.map(x =>
      `<div class="match">
        <div class="league">${x.league}</div>
        <div>${x.match} (${x.status})</div>
      </div>`
    ).join("");
});
</script>

</body>
</html>
