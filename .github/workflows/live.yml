name: Auto Live IPTV

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install requests

      - name: Generate Live Playlist
        run: python generate_live.py

      - name: Commit update
        run: |
          git config user.name "livebot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "auto live update" || echo "no changes"
          git push
