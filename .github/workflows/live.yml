name: Auto Live IPTV (API-Football)

on:
  # Jalan otomatis kalau ada perubahan script / config
  push:
    paths:
      - "**/*.py"
      - "providers.json"
      - "playlist_sources.txt"
      - ".github/workflows/live.yml"

  # Jalan otomatis tiap 5 menit
  schedule:
    - cron: "*/5 * * * *"

  # Manual trigger
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # WAJIB agar bisa commit & push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate Live Playlist
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          python generate_live.py

      - name: Commit & Push (only if changed)
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "livebot"
            git config user.email "livebot@github.com"
            git add output/event_combined.m3u output/schedule.json
            git commit -m "auto update live $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes detected, skip commit."
          fi
