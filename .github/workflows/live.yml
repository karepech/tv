name: Auto Live IPTV (MODE A)

on:
  # Trigger jika script / config berubah
  push:
    paths:
      - "**/*.py"
      - "providers.json"
      - "playlist_sources.txt"
      - ".github/workflows/live.yml"

  # Trigger otomatis tiap 5 menit
  schedule:
    - cron: "*/5 * * * *"

  # Trigger manual
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install requests

      - name: Generate playlist
        run: python generate_live.py

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "livebot"
            git config user.email "livebot@github.com"
            git add output/event_combined.m3u output/schedule.json
            git commit -m "auto update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes detected"
          fi
