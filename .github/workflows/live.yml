name: Auto Live IPTV (Smart Trigger)

on:
  # Jalan otomatis jika ada perubahan file penting
  push:
    paths:
      - "**/*.py"
      - "providers.json"
      - "playlist_sources.txt"
      - ".github/workflows/live.yml"

  # Jalan otomatis tiap 5 menit
  schedule:
    - cron: "*/5 * * * *"

  # Manual run
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # ⬅️ WAJIB untuk push commit

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate Live Playlist
        run: |
          python generate_live.py

      - name: Commit if output changed
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "livebot"
            git config user.email "livebot@github.com"
            git add .
            git commit -m "auto update live event"
            git push
          else
            echo "No changes detected"
          fi
